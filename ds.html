<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Structures Lab — Akshat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0c0d0c;
    --panel: #131513;
    --panel-raised: #171916;
    --border: rgba(255,255,255,0.09);
    --border-soft: rgba(255,255,255,0.05);
    --text: #e8ece6;
    --text-muted: #82897f;
    --text-faint: #52564f;
    --green: #5fd98a;
    --green-dim: rgba(95,217,138,0.12);
    --amber: #c2a06a;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
    min-height: 100vh;
  }

  ::selection{ background: var(--green-dim); color: var(--green); }

  a{ color: inherit; }

  .wrap{
    max-width: 880px;
    margin: 0 auto;
    padding: 72px 28px 100px;
  }

  /* header */

  .masthead{
    margin-bottom: 44px;
  }

  .masthead h1{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: clamp(28px, 4vw, 38px);
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .masthead h1 .cursor{
    display: inline-block;
    width: 9px;
    height: 0.85em;
    background: var(--green);
    margin-left: 6px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink{ 50% { opacity: 0; } }

  .masthead p{
    max-width: 54ch;
    color: var(--text-muted);
    font-size: 15px;
    margin-top: 14px;
  }

  .masthead p a{
    color: var(--text);
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    transition: border-color 0.2s ease;
  }
  .masthead p a:hover{ border-color: var(--green); }

  /* stat row */

  .stats{
    display: flex;
    justify-content: center;
    margin-top: 32px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat{
    flex: none;
    padding: 16px 36px;
    border-right: 1px solid var(--border);
    text-align: center;
  }
  .stat:last-child{ border-right: none; }
  .stat .n{
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }
  .stat .n.green{ color: var(--green); }
  .stat .l{
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* week section */

  .week-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    margin: 48px 0 16px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .week-label::after{
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (max-width: 640px){
    .grid{ grid-template-columns: 1fr; }
    .wrap{ padding: 48px 18px 80px; }
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 18px 18px 16px;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: border-color 0.2s ease, background 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover{
    border-color: rgba(255,255,255,0.18);
    background: var(--panel-raised);
  }
  .card:focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  .card.placeholder{
    border-style: dashed;
    background: transparent;
  }
  .card.placeholder:hover{
    background: var(--panel);
    border-color: var(--border);
  }

  .card-top{
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
  }
  .status-dot.ready{
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-dim);
  }

  .card-file{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .card-title{
    font-size: 15.5px;
    font-weight: 500;
    color: var(--text);
  }

  .card-desc{
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .card-parts{
    display: flex;
    gap: 6px;
    margin-top: 2px;
  }
  .part-chip{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-faint);
  }
  .part-chip.ready{
    color: var(--green);
    border-color: rgba(95,217,138,0.3);
  }

  /* footer */

  .page-footer{
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .page-footer a{
    color: var(--text-muted);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  .page-footer a:hover{ color: var(--green); border-color: var(--green); }

  /* drawer */

  .scrim{
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .scrim.open{ opacity: 1; pointer-events: auto; }

  .drawer{
    position: fixed;
    top: 50%; left: 50%;
    width: min(920px, 94vw);
    max-height: 90vh;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%) scale(0.96);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
    z-index: 11;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open{
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  .drawer-head{
    padding: 24px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
  }
  .drawer-file{
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    color: var(--text);
  }
  .drawer-title{
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 5px;
  }
  .drawer-close{
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .drawer-close:hover{ color: var(--text); border-color: rgba(255,255,255,0.25); }

  .drawer-tabs{
    display: flex;
    gap: 4px;
    padding: 14px 28px 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .drawer-tab{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    padding: 9px 13px;
    color: var(--text-faint);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s ease;
  }
  .drawer-tab.active{
    color: var(--green);
    border-bottom-color: var(--green);
  }
  .drawer-tab:hover:not(.active){ color: var(--text-muted); }
  .drawer-tab .dot{
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background: var(--text-faint); margin-right: 6px; vertical-align: 1px;
  }
  .drawer-tab.active .dot{ background: var(--green); }

  .drawer-body{
    flex: 1;
    overflow-y: auto;
    padding: 0;
  }

  .code-desc{
    padding: 22px 28px 4px;
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.65;
  }

  .code-toolbar{
    display: flex;
    justify-content: flex-end;
    padding: 12px 28px 0;
  }
  .copy-btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 7px 12px;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .copy-btn:hover{ border-color: var(--green); color: var(--green); }

  .code-block{
    display: flex;
    padding: 16px 0 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
    line-height: 1.8;
    overflow-x: auto;
  }
  .code-lines{
    padding: 0 16px 0 26px;
    color: var(--text-faint);
    text-align: right;
    user-select: none;
  }
  .code-content{
    padding-right: 26px;
    white-space: pre;
  }

  .tok-kw{ color: var(--green); }
  .tok-type{ color: var(--green); opacity: 0.85; }
  .tok-str{ color: var(--amber); }
  .tok-com{ color: var(--text-faint); font-style: italic; }
  .tok-pre{ color: var(--text-muted); }
  .tok-num{ color: var(--amber); opacity: 0.85; }

  .empty-state{
    padding: 40px 22px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-state strong{ color: var(--text); }

  @media (max-width: 640px){
    .drawer{ width: 96vw; max-height: 92vh; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <h1>data_structures_lab<span class="cursor"></span></h1>
    <p>
      C programs from Akshat's Data Structures Lab (CS6, Semester III, MIT Bengaluru,
      2026–27). Open a file below to read the code, copy it, or check on
      <a href="https://github.com/akshat-2337/data-structures-lab-code" target="_blank" rel="noopener">GitHub</a>.
    </p>

    <div class="stats" id="stats"></div>
  </header>

  <section id="weeksContainer"></section>

  <footer class="page-footer">
    <span>Snapshot of the repo — newer pushes may not show here yet.</span>
    <a href="https://github.com/akshat-2337/data-structures-lab-code" target="_blank" rel="noopener">View repo on GitHub →</a>
  </footer>

</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div>
      <div class="drawer-file" id="drawerFile">—</div>
      <div class="drawer-title" id="drawerTitle">—</div>
    </div>
    <button class="drawer-close" id="drawerClose" aria-label="Close">✕</button>
  </div>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script>
  // ---- data -------------------------------------------------------------
  // Each "entry" is a card. A card can hold one file, or several parts of
  // the same question (i, ii, iii). Add new weeks/questions here as the
  // repo grows — the UI builds itself from this array.

  const REPO = "https://github.com/akshat-2337/data-structures-lab-code";

  const weeks = [
    {
      week: 1,
      entries: [
        {
          question: "Question 1",
          parts: [
            { label: null, filename: "week1_q1.c", ready: true,
              description: "Search for a key in an array of integers using linear search.",
              code: `/* Given an array of n integers and a key element, write a C program to search the element using linear search. */

#include <stdio.h>

int main() {
    int n, a[100], key, i, pos = -1;

    scanf("%d", &n);

    for (i = 0; i < n; i++)
        scanf("%d", &a[i]);

    scanf("%d", &key);

    for (i = 0; i < n; i++) {
        if (a[i] == key) {
            pos = i;
            break;
        }
    }

    if (pos != -1)
        printf("Element found at position %d", pos + 1);
    else
        printf("Element not found");

    return 0;
}`
            }
          ]
        },
        {
          question: "Question 2",
          parts: [
            { label: null, filename: "week1_q2.c", ready: true,
              description: "Find the position of a key in a sorted array using binary search.",
              code: `/* Given an array of integers, implement binary search to find the position of a given key. */

#include <stdio.h>

int main() {
    int n, a[100], key, low, high, mid, pos = -1, i;

    scanf("%d", &n);

    for (i = 0; i < n; i++)
        scanf("%d", &a[i]);

    scanf("%d", &key);

    low = 0;
    high = n - 1;

    while (low <= high) {
        mid = (low + high) / 2;

        if (a[mid] == key) {
            pos = mid;
            break;
        } else if (key < a[mid])
            high = mid - 1;
        else
            low = mid + 1;
    }

    if (pos != -1)
        printf("Element found at position %d", pos + 1);
    else
        printf("Element not found");

    return 0;
}`
            }
          ]
        },
        {
          question: "Question 3",
          parts: [
            { label: "i", filename: "week1_q3i.c", ready: true,
              description: "Sort a list of elements using bubble sort.",
              code: `/* Write a C program to sort a given list of elements using Bubble Sort. */

#include <stdio.h>

int main() {
    int n, a[100], i, j, temp;

    scanf("%d", &n);

    for (i = 0; i < n; i++)
        scanf("%d", &a[i]);

    for (i = 0; i < n - 1; i++) {
        for (j = 0; j < n - i - 1; j++) {
            if (a[j] > a[j + 1]) {
                temp = a[j];
                a[j] = a[j + 1];
                a[j + 1] = temp;
            }
        }
    }

    for (i = 0; i < n; i++)
        printf("%d ", a[i]);

    return 0;
}`
            },
            { label: "ii", filename: "week1_q3ii.c", ready: true,
              description: "Sort a list of elements using selection sort.",
              code: `/* Write a C program to sort a given list of elements using Selection Sort. */

#include <stdio.h>

int main() {
    int n, a[100], i, j, min, temp;

    scanf("%d", &n);

    for (i = 0; i < n; i++)
        scanf("%d", &a[i]);

    for (i = 0; i < n - 1; i++) {
        min = i;

        for (j = i + 1; j < n; j++) {
            if (a[j] < a[min])
                min = j;
        }

        temp = a[i];
        a[i] = a[min];
        a[min] = temp;
    }

    for (i = 0; i < n; i++)
        printf("%d ", a[i]);

    return 0;
}`
            },
            { label: "iii", filename: "week1_q3iii.c", ready: true,
              description: "Sort a list of elements using insertion sort.",
              code: `/* Write a C program to sort a given list of elements using Insertion Sort. */

#include <stdio.h>

int main() {
    int n, a[100], i, j, key;

    scanf("%d", &n);

    for (i = 0; i < n; i++)
        scanf("%d", &a[i]);

    for (i = 1; i < n; i++) {
        key = a[i];
        j = i - 1;

        while (j >= 0 && a[j] > key) {
            a[j + 1] = a[j];
            j--;
        }

        a[j + 1] = key;
    }

    for (i = 0; i < n; i++)
        printf("%d ", a[i]);

    return 0;
}`
            }
          ]
        }
      ]
    },
    {
      week: 2,
      entries: [
        {
          question: "Not published yet",
          parts: [
            { label: null, filename: "week2_*.c", ready: false, description: null, code: "" }
          ]
        }
      ]
    },
    {
      week: 3,
      entries: [
        {
          question: "Not published yet",
          comingSoonCount: 6,
          parts: [
            { label: null, filename: "week2_*.c", ready: false, description: null, code: "" }
          ]
        }
      ]
    }
  ];

  // ---- tiny C syntax highlighter -----------------------------------------

  const KEYWORDS = ["if","else","for","while","do","return","switch","case","break","continue","default","goto","sizeof","typedef","struct","union","enum","static","const","void"];
  const TYPES = ["int","float","double","char","long","short","unsigned","signed"];

  function escapeHtml(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function highlight(code){
    const lines = code.split("\n");
    return lines.map(line => {
      let out = "";
      let i = 0;
      while (i < line.length){
        const rest = line.slice(i);

        // comments
        let m = rest.match(/^\/\*.*?(\*\/|$)/) || rest.match(/^\/\/.*/);
        if (m){ out += `<span class="tok-com">${escapeHtml(m[0])}</span>`; i += m[0].length; continue; }

        // preprocessor
        m = rest.match(/^#\w+.*/);
        if (m && out === ""){ out += `<span class="tok-pre">${escapeHtml(m[0])}</span>`; i += m[0].length; continue; }

        // strings / chars
        m = rest.match(/^"(\\.|[^"\\])*"/) || rest.match(/^'(\\.|[^'\\])*'/);
        if (m){ out += `<span class="tok-str">${escapeHtml(m[0])}</span>`; i += m[0].length; continue; }

        // numbers
        m = rest.match(/^\b\d+\.?\d*\b/);
        if (m){ out += `<span class="tok-num">${escapeHtml(m[0])}</span>`; i += m[0].length; continue; }

        // words
        m = rest.match(/^[A-Za-z_]\w*/);
        if (m){
          const w = m[0];
          if (KEYWORDS.includes(w)) out += `<span class="tok-kw">${w}</span>`;
          else if (TYPES.includes(w)) out += `<span class="tok-type">${w}</span>`;
          else out += escapeHtml(w);
          i += w.length; continue;
        }

        out += escapeHtml(line[i]);
        i += 1;
      }
      return out || " ";
    });
  }

  // ---- build header stats -------------------------------------------------

  const allParts = weeks.flatMap(w => w.entries.filter(e => e.question !== "Not published yet").flatMap(e => e.parts));
  const readyCount = allParts.filter(p => p.ready).length;
  const placeholderComingSoon = weeks.flatMap(w => w.entries.filter(e => e.question === "Not published yet"))
    .reduce((sum, e) => sum + (e.comingSoonCount || 0), 0);
  const comingSoonCount = (allParts.length - readyCount) + placeholderComingSoon;

  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${allParts.length}</div><div class="l">files in repo</div></div>
    <div class="stat"><div class="n green">${readyCount}</div><div class="l">ready to read</div></div>
    <div class="stat"><div class="n">${comingSoonCount}</div><div class="l">coming soon</div></div>
  `;

  // ---- build weeks + grids -------------------------------------------------

  const weeksContainer = document.getElementById("weeksContainer");

  weeks.forEach(w => {
    const label = document.createElement("div");
    label.className = "week-label";
    label.textContent = `week ${w.week}`;
    weeksContainer.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "grid";
    weeksContainer.appendChild(grid);

    w.entries.forEach(entry => {
      const anyReady = entry.parts.some(p => p.ready);
      const single = entry.parts.length === 1;
      const unpublished = entry.question === "Not published yet";

      const card = document.createElement("button");
      card.className = "card" + (unpublished ? " placeholder" : "");
      card.type = "button";

      if (unpublished){
        card.innerHTML = `
          <div class="card-top">
            <span class="card-file">week ${w.week}</span>
            <span class="status-dot"></span>
          </div>
          <div class="card-title">Lab not published yet</div>
          <div class="card-desc">Nothing's up for week ${w.week} yet. Check back once Akshat pushes it, or look at the repo directly.</div>
        `;
        card.addEventListener("click", () => openDrawer(entry, entry.parts[0].filename));
      } else if (single){
        const p = entry.parts[0];
        card.innerHTML = `
          <div class="card-top">
            <span class="card-file">${p.filename}</span>
            <span class="status-dot ${p.ready ? 'ready' : ''}"></span>
          </div>
          <div class="card-title">${entry.question}</div>
          <div class="card-desc">${p.description ? p.description : "Code not added yet."}</div>
        `;
        card.addEventListener("click", () => openDrawer(entry, p.filename));
      } else {
        card.innerHTML = `
          <div class="card-top">
            <span class="card-file">week${w.week}_q3*.c</span>
            <span class="status-dot ${anyReady ? 'ready' : ''}"></span>
          </div>
          <div class="card-title">${entry.question} — ${entry.parts.length} parts</div>
          <div class="card-desc">${anyReady ? "All parts are up." : "Code not added yet."}</div>
          <div class="card-parts">
            ${entry.parts.map(p => `<span class="part-chip ${p.ready ? 'ready':''}">${p.label}</span>`).join("")}
          </div>
        `;
        const defaultFile = (entry.parts.find(p => p.ready) || entry.parts[0]).filename;
        card.addEventListener("click", () => openDrawer(entry, defaultFile));
      }

      grid.appendChild(card);
    });
  });

  // ---- drawer -----------------------------------------------------------

  const scrim = document.getElementById("scrim");
  const drawer = document.getElementById("drawer");
  const drawerFile = document.getElementById("drawerFile");
  const drawerTitle = document.getElementById("drawerTitle");
  const drawerTabs = document.getElementById("drawerTabs");
  const drawerBody = document.getElementById("drawerBody");
  const drawerClose = document.getElementById("drawerClose");

  let activeEntry = null;

  function openDrawer(entry, filename){
    activeEntry = entry;
    renderDrawer(filename);
    scrim.classList.add("open");
    drawer.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeDrawer(){
    scrim.classList.remove("open");
    drawer.classList.remove("open");
    document.body.style.overflow = "";
  }

  function renderDrawer(filename){
    const part = activeEntry.parts.find(p => p.filename === filename);

    drawerFile.textContent = filename;
    drawerTitle.textContent = activeEntry.question + (part.label ? ` · Part ${part.label}` : "");

    if (activeEntry.parts.length > 1){
      drawerTabs.style.display = "flex";
      drawerTabs.innerHTML = activeEntry.parts.map(p => `
        <button class="drawer-tab ${p.filename === filename ? 'active' : ''}" data-file="${p.filename}">
          <span class="dot"></span>Part ${p.label}
        </button>
      `).join("");
      drawerTabs.querySelectorAll(".drawer-tab").forEach(btn => {
        btn.addEventListener("click", () => renderDrawer(btn.dataset.file));
      });
    } else {
      drawerTabs.style.display = "none";
      drawerTabs.innerHTML = "";
    }

    if (activeEntry.question === "Not published yet"){
      drawerBody.innerHTML = `
        <div class="empty-state">
          <strong>This week hasn't been published yet.</strong><br>
          Check the <a href="${REPO}" target="_blank" rel="noopener" style="color:var(--green); border-bottom:1px solid rgba(95,217,138,0.3); text-decoration:none;">GitHub repo</a>
          for the latest version, or come back once Akshat pushes the lab.
        </div>
      `;
      return;
    }

    if (!part.ready){
      drawerBody.innerHTML = `
        <div class="empty-state">
          <strong>${filename}</strong> hasn't been pushed yet.<br>
          Check the <a href="${REPO}" target="_blank" rel="noopener" style="color:var(--green); border-bottom:1px solid rgba(95,217,138,0.3); text-decoration:none;">GitHub repo</a>
          for the latest version, or come back once Akshat adds it.
        </div>
      `;
      return;
    }

    const lines = highlight(part.code);
    drawerBody.innerHTML = `
      ${part.description ? `<div class="code-desc">${part.description}</div>` : ""}
      <div class="code-toolbar"><button class="copy-btn" id="copyBtn">copy</button></div>
      <div class="code-block">
        <div class="code-lines">${lines.map((_, i) => i + 1).join("<br>")}</div>
        <div class="code-content">${lines.join("<br>")}</div>
      </div>
    `;

    document.getElementById("copyBtn").addEventListener("click", (e) => {
      navigator.clipboard.writeText(part.code);
      e.target.textContent = "copied";
      setTimeout(() => { e.target.textContent = "copy"; }, 1400);
    });
  }

  drawerClose.addEventListener("click", closeDrawer);
  scrim.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeDrawer();
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabVault</title>
<meta name="description" content="A sleek, self-updating vault for your lab programs — pulled live from GitHub, organized week by week, ready whenever you need to revisit them.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A0A0C'/%3E%3Cpath d='M7 10V8a5 5 0 0 1 10 0v2' stroke='%233B82F6' stroke-width='1.6' fill='none'/%3E%3Crect x='5' y='10' width='14' height='9' rx='2' fill='%233B82F6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root{
    --bg-base:#0A0A0C;
    --bg-glass:rgba(255,255,255,0.05);
    --bg-glass-hover:rgba(255,255,255,0.08);
    --border-glass:rgba(255,255,255,0.1);
    --border-glass-strong:rgba(255,255,255,0.18);
    --blue:#3B82F6;
    --blue-glow:#60A5FA;
    --orange:#F97316;
    --neon:#39FF88;
    --text-primary:#F5F5F7;
    --text-secondary:#9CA3AF;
    --text-tertiary:#6B7280;
    --font-display:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:8px;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--bg-base);
    color:var(--text-primary);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    min-height:100vh;
  }

  a{color:inherit}

  button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}

  :focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:4px}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border-glass-strong);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-tertiary)}

  /* ---------- background decor ---------- */
  .bg-decor{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
  }
  .bg-blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:0.22}
  .bg-blob--blue{width:520px;height:520px;background:var(--blue);top:-160px;left:-120px;animation:drift1 22s ease-in-out infinite}
  .bg-blob--orange{width:420px;height:420px;background:var(--orange);bottom:-140px;right:-100px;opacity:0.14;animation:drift2 26s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,-25px)}}

  /* ---------- glass primitive ---------- */
  .glass-panel{
    background:var(--bg-glass);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border-glass);
    border-radius:var(--radius-lg);
  }

  /* ---------- layout shells ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px clamp(20px,5vw,56px);
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:600;font-size:1.05rem;letter-spacing:-0.01em;
  }
  .brand svg{flex-shrink:0}
  .topbar-actions{display:flex;align-items:center;gap:10px}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-size:0.88rem;font-weight:500;
    padding:9px 16px;border-radius:999px;
    transition:transform .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease);
    border:1px solid transparent;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97)}
  .btn-outline{border-color:var(--border-glass-strong);color:var(--text-secondary)}
  .btn-outline:hover{color:var(--text-primary);border-color:var(--blue-glow);background:rgba(59,130,246,0.08)}
  .btn-icon{padding:9px;border-radius:999px;border:1px solid var(--border-glass-strong);color:var(--text-secondary)}
  .btn-icon:hover{color:var(--text-primary);border-color:var(--blue-glow)}
  .btn-icon.is-spinning svg{animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- landing ---------- */
  .landing{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px 80px;
  }
  .hero-eyebrow{
    font-family:var(--font-mono);font-size:0.78rem;color:var(--text-tertiary);
    margin-bottom:18px;opacity:0;
  }
  .hero-title{
    font-size:clamp(3rem,9vw,5.5rem);font-weight:700;letter-spacing:-0.03em;line-height:1;
    background:linear-gradient(180deg,#ffffff 0%,#c9ccd4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;
  }
  .hero-subtitle{
    margin-top:18px;color:var(--text-secondary);font-size:clamp(1rem,2.2vw,1.15rem);
    max-width:480px;line-height:1.55;opacity:0;
  }

  .landing.ready .hero-eyebrow{animation:riseIn .6s var(--ease) forwards}
  .landing.ready .hero-title{animation:riseIn .7s var(--ease) .08s forwards}
  .landing.ready .hero-subtitle{animation:riseIn .7s var(--ease) .18s forwards}
  .landing.ready .cards .card:nth-child(1){animation:riseIn .7s var(--ease) .28s forwards}
  .landing.ready .cards .card:nth-child(2){animation:riseIn .7s var(--ease) .36s forwards}
  @keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  .cards{
    margin-top:52px;display:grid;grid-template-columns:1fr 1fr;gap:20px;
    width:100%;max-width:760px;
  }
  @media (max-width:640px){.cards{grid-template-columns:1fr}}

  .card{
    opacity:0;
    position:relative;text-align:left;padding:28px 26px;border-radius:var(--radius-lg);
    background:var(--bg-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border-glass);
    transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);
    display:flex;flex-direction:column;gap:14px;min-height:190px;
  }
  .card-icon{
    width:42px;height:42px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(59,130,246,0.12);color:var(--blue-glow);
  }
  .card--locked .card-icon{background:rgba(249,115,22,0.12);color:var(--orange)}
  .card-title{font-size:1.3rem;font-weight:600;letter-spacing:-0.01em}
  .card-desc{color:var(--text-secondary);font-size:0.92rem;line-height:1.5;flex:1}
  .card-status{
    font-family:var(--font-mono);font-size:0.75rem;
    display:inline-flex;align-items:center;gap:6px;width:fit-content;
  }
  .card--active .card-status{color:var(--blue-glow)}
  .card--active .card-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon)}
  .card--locked .card-status{color:var(--orange);padding:4px 10px;border:1px solid rgba(249,115,22,0.35);border-radius:999px;background:rgba(249,115,22,0.08)}

  .card--active{cursor:pointer}
  .card--active:hover{transform:translateY(-4px);border-color:var(--blue-glow);box-shadow:0 20px 45px -20px rgba(59,130,246,0.35)}
  .card--active .go-arrow{position:absolute;top:26px;right:26px;opacity:0;transform:translateX(-4px);transition:all .25s var(--ease);color:var(--blue-glow)}
  .card--active:hover .go-arrow{opacity:1;transform:translateX(0)}

  .card--locked{cursor:pointer}
  .card--locked.shake{animation:shake .45s ease}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    padding:12px 20px;border-radius:999px;font-size:0.86rem;
    background:rgba(20,20,24,0.9);border:1px solid var(--border-glass-strong);
    backdrop-filter:blur(12px);opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- data structures page ---------- */
  .page{flex:1;padding:8px clamp(20px,5vw,56px) 60px;width:100%;max-width:900px;margin:0 auto}
  .page-header{margin:28px 0 40px}
  .page-title{font-size:clamp(2rem,5vw,2.6rem);font-weight:700;letter-spacing:-0.02em}
  .page-subtitle{color:var(--text-secondary);margin-top:10px;font-size:0.98rem;line-height:1.6;max-width:520px}
  .page-subtitle a{color:var(--blue-glow);text-decoration:none;border-bottom:1px solid rgba(96,165,250,0.35)}
  .page-subtitle a:hover{border-color:var(--blue-glow)}

  .weeks{display:flex;flex-direction:column;gap:14px}

  .week{border-radius:var(--radius-lg);overflow:hidden}
  .week-header{
    width:100%;display:flex;align-items:center;gap:16px;padding:18px 22px;text-align:left;
  }
  .week--active .week-header{background:var(--bg-glass)}
  .week--active .week-header:hover{background:var(--bg-glass-hover)}
  .week--locked .week-header{background:rgba(255,255,255,0.02);cursor:pointer}

  .week-number{
    font-family:var(--font-mono);font-size:0.85rem;color:var(--text-tertiary);
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border-glass-strong);flex-shrink:0;
  }
  .week--active .week-number{color:var(--blue-glow);border-color:rgba(96,165,250,0.4)}

  .week-title{font-weight:600;font-size:1.05rem}
  .week-meta{flex:1}
  .week-meta-sub{font-size:0.82rem;color:var(--text-tertiary);margin-top:2px;font-family:var(--font-mono)}

  .week-badge{
    font-family:var(--font-mono);font-size:0.72rem;color:var(--orange);
    padding:4px 10px;border:1px solid rgba(249,115,22,0.35);border-radius:999px;
    background:rgba(249,115,22,0.08);display:flex;align-items:center;gap:6px;flex-shrink:0;
  }

  .chevron{color:var(--text-tertiary);transition:transform .3s var(--ease);flex-shrink:0}
  .week--expanded .chevron{transform:rotate(180deg);color:var(--blue-glow)}

  .week-body{max-height:0;overflow:hidden;transition:max-height .35s var(--ease)}
  .week-body-inner{padding:6px 22px 18px;display:flex;flex-direction:column;gap:6px}

  .file-row{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:12px 14px;border-radius:var(--radius-sm);text-align:left;
    transition:background .18s var(--ease),transform .18s var(--ease);
  }
  .file-row:hover{background:rgba(255,255,255,0.05);transform:translateX(2px)}
  .file-badge{
    font-family:var(--font-mono);font-size:0.68rem;font-weight:600;
    padding:4px 8px;border-radius:6px;flex-shrink:0;min-width:38px;text-align:center;
  }
  .file-badge--blue{background:rgba(59,130,246,0.14);color:var(--blue-glow)}
  .file-badge--neon{background:rgba(57,255,136,0.12);color:var(--neon)}
  .file-badge--muted{background:rgba(255,255,255,0.08);color:var(--text-secondary)}
  .file-name{font-family:var(--font-mono);font-size:0.9rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-open-icon{color:var(--text-tertiary);flex-shrink:0}
  .file-row:hover .file-open-icon{color:var(--blue-glow)}

  /* ---------- skeleton / state panels ---------- */
  .skeleton-week{height:68px;border-radius:var(--radius-lg)}
  .skeleton{
    background:linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 37%, rgba(255,255,255,0.04) 63%);
    background-size:400% 100%;animation:shimmer 1.8s ease infinite;
  }
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  .state-panel{padding:34px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .state-icon{color:var(--text-tertiary)}
  .state-title{font-weight:600;font-size:1.1rem}
  .state-message{color:var(--text-secondary);font-size:0.9rem;max-width:400px;line-height:1.55}

  .mini-state{padding:16px;display:flex;align-items:center;gap:10px;color:var(--text-tertiary);font-size:0.85rem}
  .spinner{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--border-glass-strong);border-top-color:var(--blue-glow);
    animation:spin .7s linear infinite;
  }

  /* ---------- footer ---------- */
  .footer-credit{
    text-align:center;padding:28px 24px 40px;
    font-family:var(--font-mono);font-size:0.78rem;color:var(--text-tertiary);
  }
  .footer-credit a{color:var(--text-secondary);text-decoration:none;border-bottom:1px solid var(--border-glass-strong)}
  .footer-credit a:hover{color:var(--blue-glow);border-color:var(--blue-glow)}
  .footer-credit .dot{margin:0 8px;opacity:0.5}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,5,7,0.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s var(--ease);
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto}
  .modal{
    width:100%;max-width:760px;max-height:82vh;display:flex;flex-direction:column;
    background:#111114;border:1px solid var(--border-glass-strong);border-radius:var(--radius-lg);
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6);
    transform:scale(0.94) translateY(10px);opacity:0;transition:all .28s var(--ease);
  }
  .modal-backdrop.open .modal{transform:scale(1) translateY(0);opacity:1}

  .modal-header{
    display:flex;align-items:center;gap:12px;padding:16px 18px;
    border-bottom:1px solid var(--border-glass);flex-shrink:0;
  }
  .modal-filename{font-family:var(--font-mono);font-size:0.92rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-header .file-badge{flex-shrink:0}
  .copy-btn{
    font-family:var(--font-mono);font-size:0.78rem;
    padding:7px 12px;border-radius:8px;border:1px solid var(--border-glass-strong);color:var(--text-secondary);
    transition:all .2s var(--ease);flex-shrink:0;
  }
  .copy-btn:hover:not(:disabled){color:var(--text-primary);border-color:var(--blue-glow)}
  .copy-btn:disabled{opacity:0.4;cursor:default}
  .copy-btn.copied{color:var(--neon);border-color:var(--neon);background:rgba(57,255,136,0.08)}
  .modal-close{
    width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--text-secondary);flex-shrink:0;
  }
  .modal-close:hover{color:var(--text-primary);background:rgba(255,255,255,0.06)}

  .modal-body{overflow:auto;flex:1}
  .modal-body pre{margin:0}
  .modal-body pre code.hljs{
    background:transparent!important;padding:20px 22px!important;
    font-family:var(--font-mono)!important;font-size:0.86rem!important;line-height:1.65!important;
  }

  body.modal-open{overflow:hidden}

  @media (max-width:640px){
    .modal-backdrop{padding:0}
    .modal{max-width:100%;max-height:100%;height:100%;border-radius:0}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.001s!important;animation-iteration-count:1!important;
      transition-duration:0.001s!important;scroll-behavior:auto!important;
    }
    .hero-eyebrow,.hero-title,.hero-subtitle,.card{opacity:1!important}
  }
</style>
</head>
<body>

<div class="bg-decor">
  <div class="bg-grid"></div>
  <div class="bg-blob bg-blob--blue"></div>
  <div class="bg-blob bg-blob--orange"></div>
</div>

<div id="app"></div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/c.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>

<script>
'use strict';

/* =========================================================
   CONFIG — the only thing you'd touch to point this at a
   different repo, or to change how many placeholder weeks
   show up before real content exists.
========================================================= */
const CONFIG = {
  owner: 'akshat-2337',
  repo: 'data-structures-lab-code',
  maxPlaceholderWeeks: 3,
  apiBase: 'https://api.github.com/repos',
  cachePrefix: 'labvault_'
};

const REPO_URL = `https://github.com/${CONFIG.owner}/${CONFIG.repo}`;

const ICONS = {
  layers: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
  lock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="9" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  lockSm: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="9" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
  chevron: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  arrow: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  fileArrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  refresh: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  vault: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M12 8v1.2M12 14.8V16M8 12h1.2M14.8 12H16"/></svg>',
  warn: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.7 3.86a2 2 0 0 0-3.4 0Z"/></svg>'
};

const LANG_MAP = { c:'c', h:'c', cpp:'cpp', cc:'cpp', cxx:'cpp', hpp:'cpp', py:'python', java:'java', js:'javascript', jsx:'javascript', ts:'typescript', tsx:'typescript', md:'markdown', json:'json', sh:'bash', txt:'plaintext' };
const BADGE_MAP = { c:'C', h:'C', cpp:'C++', cc:'C++', cxx:'C++', hpp:'C++', py:'PY', java:'JAVA', js:'JS', ts:'TS', md:'MD', json:'JSON', sh:'SH', txt:'TXT' };
const BADGE_STYLE = { c:'blue', cpp:'blue', java:'blue', py:'neon' };

function getExt(name){ const p = name.split('.'); return p.length > 1 ? p.pop().toLowerCase() : ''; }
function getLanguage(name){ return LANG_MAP[getExt(name)] || 'plaintext'; }
function getBadgeLabel(name){ const e = getExt(name); return BADGE_MAP[e] || (e ? e.toUpperCase() : 'FILE'); }
function getBadgeStyle(name){ return BADGE_STYLE[getExt(name)] || 'muted'; }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str == null ? '' : String(str); return d.innerHTML; }

/* =========================================================
   CACHE — sessionStorage, cleared manually via Refresh.
   Keeps repeat visits within a session off GitHub's
   60 req/hour unauthenticated rate limit.
========================================================= */
function cacheGet(key){
  try{
    const raw = sessionStorage.getItem(CONFIG.cachePrefix + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function cacheSet(key, value){
  try{ sessionStorage.setItem(CONFIG.cachePrefix + key, JSON.stringify(value)); }catch(e){ /* storage unavailable — fine, just skip caching */ }
}
function cacheClearAll(){
  try{
    Object.keys(sessionStorage)
      .filter(k => k.startsWith(CONFIG.cachePrefix))
      .forEach(k => sessionStorage.removeItem(k));
  }catch(e){ /* no-op */ }
}

/* =========================================================
   GITHUB SERVICE
========================================================= */
class RateLimitError extends Error{
  constructor(resetHeader){
    const resetText = resetHeader ? new Date(parseInt(resetHeader,10) * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : null;
    super(resetText ? `GitHub's public rate limit (60 requests/hour) is used up. It resets around ${resetText}.` : `GitHub's public rate limit (60 requests/hour) is used up. Try again in a bit.`);
    this.name = 'RateLimitError';
  }
}

async function githubFetch(url){
  let res;
  try{
    res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
  }catch(e){
    throw new Error('Could not reach GitHub. Check your connection and try again.');
  }
  if(!res.ok){
    if(res.status === 403 && res.headers.get('x-ratelimit-remaining') === '0'){
      throw new RateLimitError(res.headers.get('x-ratelimit-reset'));
    }
    if(res.status === 404){
      throw new Error('Repository or folder not found.');
    }
    throw new Error(`GitHub request failed (${res.status}).`);
  }
  return res.json();
}

async function fetchRootWeeks(forceRefresh){
  const cacheKey = 'root';
  if(!forceRefresh){
    const cached = cacheGet(cacheKey);
    if(cached) return cached;
  }
  const url = `${CONFIG.apiBase}/${CONFIG.owner}/${CONFIG.repo}/contents/`;
  const data = await githubFetch(url);
  const weeks = data
    .filter(item => item.type === 'dir' && /^week\d+$/i.test(item.name))
    .map(item => ({ name: item.name, number: parseInt(item.name.match(/\d+/)[0], 10) }))
    .sort((a,b) => a.number - b.number);
  cacheSet(cacheKey, weeks);
  return weeks;
}

async function fetchWeekFiles(weekName, forceRefresh){
  const cacheKey = `week_${weekName}`;
  if(!forceRefresh){
    const cached = cacheGet(cacheKey);
    if(cached) return cached;
  }
  const url = `${CONFIG.apiBase}/${CONFIG.owner}/${CONFIG.repo}/contents/${weekName}`;
  const data = await githubFetch(url);
  const files = data
    .filter(item => item.type === 'file')
    .map(item => ({ name: item.name, download_url: item.download_url }))
    .sort((a,b) => a.name.localeCompare(b.name));
  cacheSet(cacheKey, files);
  return files;
}

async function fetchFileContent(downloadUrl){
  let res;
  try{
    res = await fetch(downloadUrl);
  }catch(e){
    throw new Error('Could not reach GitHub to load this file.');
  }
  if(!res.ok) throw new Error(`Could not load this file (${res.status}).`);
  return res.text();
}

/* =========================================================
   SHARED UI FRAGMENTS
========================================================= */
function renderErrorPanel(err, retryId){
  return `
    <div class="state-panel glass-panel">
      <div class="state-icon">${ICONS.warn}</div>
      <p class="state-title">Couldn't load the vault</p>
      <p class="state-message">${escapeHtml(err.message || 'Something went wrong.')}</p>
      <button class="btn btn-outline" id="${retryId}">Try again</button>
    </div>`;
}
function renderMiniLoading(label){
  return `<div class="mini-state"><span class="spinner"></span><span>${escapeHtml(label || 'Loading…')}</span></div>`;
}
function renderMiniError(err){
  return `<div class="mini-state" style="color:var(--orange)">${escapeHtml(err.message || 'Something went wrong.')}</div>`;
}
function showToast(message){
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
  const el = root.querySelector('.toast');
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => { root.innerHTML=''; }, 300); }, 2200);
}

/* =========================================================
   MODAL (code subwindow)
========================================================= */
let lastFocusedEl = null;

function renderModalShell(file){
  const badgeStyle = getBadgeStyle(file.name);
  return `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-filename">
        <div class="modal-header">
          <span class="file-badge file-badge--${badgeStyle}">${escapeHtml(getBadgeLabel(file.name))}</span>
          <span class="modal-filename" id="modal-filename">${escapeHtml(file.name)}</span>
          <button class="copy-btn" id="copy-btn" disabled>Copy</button>
          <button class="modal-close" id="modal-close" aria-label="Close">${ICONS.close}</button>
        </div>
        <div class="modal-body" id="modal-body">${renderMiniLoading('Fetching source…')}</div>
      </div>
    </div>`;
}

function trapFocus(e){
  const modal = document.querySelector('.modal-backdrop.open .modal');
  if(!modal) return;
  const focusable = modal.querySelectorAll('button:not([disabled]), [href], input, [tabindex]:not([tabindex="-1"])');
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

async function openFileModal(file, triggerEl){
  lastFocusedEl = triggerEl;
  const root = document.getElementById('modal-root');
  root.innerHTML = renderModalShell(file);
  document.body.classList.add('modal-open');
  const backdrop = document.getElementById('modal-backdrop');
  requestAnimationFrame(() => backdrop.classList.add('open'));

  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) closeModal(); });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-close').focus();

  const bodyEl = document.getElementById('modal-body');
  const copyBtn = document.getElementById('copy-btn');

  try{
    const content = await fetchFileContent(file.download_url);
    bodyEl.innerHTML = `<pre><code class="hljs language-${getLanguage(file.name)}"></code></pre>`;
    const codeEl = bodyEl.querySelector('code');
    codeEl.textContent = content;
    if(window.hljs){ try{ hljs.highlightElement(codeEl); }catch(e){ /* unsupported language — plain text is fine */ } }
    copyBtn.disabled = false;
    copyBtn.addEventListener('click', () => copyToClipboard(content, copyBtn));
  }catch(err){
    bodyEl.innerHTML = `<div class="mini-state" style="padding:28px;color:var(--orange)">${escapeHtml(err.message)}</div>`;
  }
}

function closeModal(){
  const backdrop = document.getElementById('modal-backdrop');
  if(!backdrop) return;
  backdrop.classList.remove('open');
  document.body.classList.remove('modal-open');
  setTimeout(() => { const root = document.getElementById('modal-root'); if(root) root.innerHTML=''; }, 260);
  if(lastFocusedEl && lastFocusedEl.focus) lastFocusedEl.focus();
}

async function copyToClipboard(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
  }catch(e){
    btn.textContent = 'Press ⌘/Ctrl+C';
  }
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1700);
}

document.addEventListener('keydown', (e) => {
  const backdrop = document.getElementById('modal-backdrop');
  if(!backdrop || !backdrop.classList.contains('open')) return;
  if(e.key === 'Escape') closeModal();
  if(e.key === 'Tab') trapFocus(e);
});

/* =========================================================
   DATA STRUCTURES PAGE
========================================================= */
function renderFooter(){
  return `
    <div class="footer-credit">
      <a href="${REPO_URL}" target="_blank" rel="noopener">github.com/${CONFIG.owner}/${CONFIG.repo}</a>
      <span class="dot">·</span>
      <span>Proudly engineered with Claude</span>
    </div>`;
}

function renderDataStructuresShell(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <button class="btn btn-outline" id="back-btn">${ICONS.back}<span>LabVault</span></button>
      <div class="topbar-actions">
        <button class="btn-icon" id="refresh-btn" aria-label="Refresh">${ICONS.refresh}</button>
      </div>
    </div>
    <div class="page">
      <div class="page-header">
        <h1 class="page-title">Data Structures</h1>
        <p class="page-subtitle">Organized by week, pulled straight from <a href="${REPO_URL}" target="_blank" rel="noopener">${CONFIG.owner}/${CONFIG.repo}</a>.</p>
      </div>
      <div class="weeks" id="weeks-container">
        <div class="skeleton skeleton-week glass-panel"></div>
        <div class="skeleton skeleton-week glass-panel"></div>
        <div class="skeleton skeleton-week glass-panel"></div>
      </div>
    </div>
    ${renderFooter()}
  `;
  document.getElementById('back-btn').addEventListener('click', () => { location.hash = '#/'; });
  document.getElementById('refresh-btn').addEventListener('click', handleRefresh);
  loadWeeksData(false);
}

async function handleRefresh(){
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('is-spinning');
  cacheClearAll();
  await loadWeeksData(true);
  btn.classList.remove('is-spinning');
}

async function loadWeeksData(forceRefresh){
  const container = document.getElementById('weeks-container');
  try{
    const weeks = await fetchRootWeeks(forceRefresh);
    const foundMap = new Map(weeks.map(w => [w.number, w]));
    const list = [];
    for(let n = 1; n <= CONFIG.maxPlaceholderWeeks; n++){
      list.push(foundMap.has(n) ? { number: n, name: foundMap.get(n).name, locked: false } : { number: n, name: `week${n}`, locked: true });
    }
    weeks.filter(w => w.number > CONFIG.maxPlaceholderWeeks)
      .sort((a,b) => a.number - b.number)
      .forEach(w => list.push({ number: w.number, name: w.name, locked: false }));

    renderWeeksList(list);
  }catch(err){
    container.innerHTML = renderErrorPanel(err, 'retry-root');
    document.getElementById('retry-root').addEventListener('click', () => loadWeeksData(true));
  }
}

function renderWeeksList(list){
  const container = document.getElementById('weeks-container');
  if(!list.length){
    container.innerHTML = `<div class="state-panel glass-panel"><p class="state-title">No weeks yet</p><p class="state-message">Push a week1 folder to the repo and it'll show up here automatically.</p></div>`;
    return;
  }
  container.innerHTML = list.map(week => {
    const num = String(week.number).padStart(2, '0');
    if(week.locked){
      return `
        <div class="week week--locked glass-panel" data-week-name="${escapeHtml(week.name)}">
          <button class="week-header" data-locked="true">
            <span class="week-number">${num}</span>
            <span class="week-meta">
              <span class="week-title">Week ${week.number}</span>
              <div class="week-meta-sub">Not pushed yet</div>
            </span>
            <span class="week-badge">${ICONS.lockSm} Coming soon</span>
          </button>
        </div>`;
    }
    return `
      <div class="week week--active glass-panel" data-week-name="${escapeHtml(week.name)}">
        <button class="week-header" aria-expanded="false" aria-controls="body-${week.name}">
          <span class="week-number">${num}</span>
          <span class="week-meta">
            <span class="week-title">Week ${week.number}</span>
          </span>
          <span class="chevron">${ICONS.chevron}</span>
        </button>
        <div class="week-body" id="body-${week.name}"></div>
      </div>`;
  }).join('');

  list.forEach(week => {
    const weekEl = container.querySelector(`.week[data-week-name="${CSS.escape(week.name)}"]`);
    if(!weekEl) return;
    if(week.locked){
      weekEl.querySelector('.week-header').addEventListener('click', () => {
        weekEl.classList.remove('shake'); void weekEl.offsetWidth; weekEl.classList.add('shake');
        showToast(`Week ${week.number} hasn't been pushed to GitHub yet.`);
      });
    } else {
      weekEl.querySelector('.week-header').addEventListener('click', () => toggleWeek(weekEl, week));
    }
  });
}

async function toggleWeek(weekEl, week){
  const header = weekEl.querySelector('.week-header');
  const body = weekEl.querySelector('.week-body');
  const isExpanded = weekEl.classList.contains('week--expanded');

  if(isExpanded){
    weekEl.classList.remove('week--expanded');
    header.setAttribute('aria-expanded', 'false');
    body.style.maxHeight = '0px';
    return;
  }

  weekEl.classList.add('week--expanded');
  header.setAttribute('aria-expanded', 'true');

  if(!weekEl.dataset.loaded){
    body.innerHTML = `<div class="week-body-inner">${renderMiniLoading('Fetching files…')}</div>`;
    body.style.maxHeight = body.scrollHeight + 'px';
    try{
      const files = await fetchWeekFiles(week.name, false);
      const subEl = weekEl.querySelector('.week-meta-sub');
      if(!files.length){
        body.innerHTML = `<div class="week-body-inner"><div class="mini-state">No files in this folder yet.</div></div>`;
      } else {
        body.innerHTML = `<div class="week-body-inner">${files.map(f => renderFileRow(f)).join('')}</div>`;
        attachFileListeners(body, files);
      }
      weekEl.dataset.loaded = 'true';
      const titleWrap = weekEl.querySelector('.week-title');
      if(titleWrap && !weekEl.querySelector('.week-meta-sub')){
        titleWrap.insertAdjacentHTML('afterend', `<div class="week-meta-sub">${files.length} file${files.length === 1 ? '' : 's'}</div>`);
      }
    }catch(err){
      body.innerHTML = `<div class="week-body-inner">${renderMiniError(err)}</div>`;
    }
    requestAnimationFrame(() => { body.style.maxHeight = body.scrollHeight + 'px'; });
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function renderFileRow(file){
  const badgeStyle = getBadgeStyle(file.name);
  return `
    <button class="file-row" data-file-name="${escapeHtml(file.name)}">
      <span class="file-badge file-badge--${badgeStyle}">${escapeHtml(getBadgeLabel(file.name))}</span>
      <span class="file-name">${escapeHtml(file.name)}</span>
      <span class="file-open-icon">${ICONS.fileArrow}</span>
    </button>`;
}

function attachFileListeners(body, files){
  body.querySelectorAll('.file-row').forEach(row => {
    const name = row.getAttribute('data-file-name');
    const file = files.find(f => f.name === name);
    if(!file) return;
    row.addEventListener('click', () => openFileModal(file, row));
  });
}

/* =========================================================
   ROUTER
========================================================= */
function router(){
  const hash = location.hash || '#/';
  window.scrollTo(0, 0);
  if(hash === '#/data-structures'){
    renderDataStructuresShell();
  } else {
    renderLandingPage();
  }
}

window.addEventListener('hashchange', router);
document.addEventListener('DOMContentLoaded', router);
</script>
